name: vecpat-pgvector

services:
  pgvector:
    image: pgvector/pgvector:pg15
    cpuset: ${VECPAT_CPUSET:-13-20}
    mem_limit: ${VECPAT_MEMORY:-32g}
    memswap_limit: ${VECPAT_MEMORY:-32g}
    shm_size: 8g
    environment:
      POSTGRES_USER: anomaly
      POSTGRES_PASSWORD: anomaly-local-only
      POSTGRES_DB: filter_anomaly
    command: ["postgres", "-c", "shared_buffers=8GB", "-c", "work_mem=256MB", "-c", "max_parallel_workers_per_gather=0"]
    volumes:
      - ./data/pgvector:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anomaly -d filter_anomaly"]
      interval: 5s
      timeout: 5s
      retries: 30

  pgvector-runner:
    build:
      context: .
      dockerfile: Dockerfile.pgvector
    entrypoint: ["python", "-m", "src.backends.pgvector.cli"]
    environment:
      PGVECTOR_DSN: postgresql://anomaly:anomaly-local-only@pgvector:5432/filter_anomaly
    volumes:
      - ./src:/app/src:ro
      - ./configs:/app/configs:ro
      - ${RESULT_DIR:-./results}:/app/result
    depends_on:
      pgvector:
        condition: service_healthy

